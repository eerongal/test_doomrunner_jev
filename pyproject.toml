[build-system]
requires = ["setuptools>=65", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "doomrunner"
version = "0.1.0"
description = "Two-level JEV and LLM controller for ViZDoom"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "Pillow>=10,<12",
    "python-dotenv>=1,<2",
    "vizdoom>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "wheel>=0.40"]

[project.scripts]
doomrunner = "doomrunner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
